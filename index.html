<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รวมรายงาน</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2733;--muted:#6b7785;--line:#dde3ea;--accent:#2b6cdf}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2129;--text:#e6ebf0;--muted:#8d99a6;--line:#2c3540;--accent:#6aa0ff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 20px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:240px}
main{max-width:1200px;margin:auto;padding:16px 20px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tags button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.tags button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;background-size:cover;background-position:top}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h2{font-size:16px;margin:0}
.body p{font-size:13px;color:var(--muted);margin:0;flex:1}
.tag{font-size:11px;color:var(--accent)}
.row{display:flex;gap:8px;margin-top:6px}
.row a,.row button{font:inherit;font-size:13px;text-align:center;border-radius:8px;padding:6px 10px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none}
.row a{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.mode{display:flex;gap:8px;align-items:center}
.mode button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.mode button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pill{background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;text-align:center;font-weight:600}
.ecard iframe{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#fff}
.ecard .row a{flex:0 0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row .sm{flex:0 0 auto;padding:6px 9px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:min(520px,94%)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
dialog input[type=text],dialog textarea{width:100%;min-width:0;margin-top:3px}
dialog textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;resize:vertical}
.prev{height:90px;border-radius:8px;margin-top:6px;background:var(--bg) center/cover no-repeat;border:1px dashed var(--line)}
.empty{color:var(--muted);padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📊 รวมรายงานของฉัน</h1>
  <div class="bar">
    <button class="btn primary" id="bAdd">＋ เพิ่มรายงาน</button>
    <div class="mode"><button id="mCard" class="on">การ์ด</button><button id="mEmb">แสดงรายงานจริง</button></div>
    <button class="btn" id="bBackup" title="ดาวน์โหลดไฟล์สำรองรายการทั้งหมด">สำรอง</button>
    <button class="btn" id="bRestore" title="นำเข้าไฟล์สำรอง">นำเข้า</button>
    <input type="file" id="fRestore" accept=".json" hidden>
    <input id="q" placeholder="ค้นหา เช่น แบต, น้ำ…">
  </div>
</header>
<main>
  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <div class="egrid" id="egrid" hidden></div>
  <div class="empty" id="empty" hidden>ไม่พบรายงาน — กด “＋ เพิ่มรายงาน” เพื่อเพิ่ม</div>
  <p class="empty" style="font-size:12px">รายการเก็บไว้ในเบราว์เซอร์นี้ ควรกด “สำรอง” เป็นระยะ เผื่อล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนเครื่อง</p>
</main>

<dialog id="dlg">
  <h3 style="margin:0" id="dTitle">เพิ่มรายงาน</h3>
  <label>ชื่อรายงาน<input type="text" id="fTitle" placeholder="เช่น แบต 12V รายวัน"></label>
  <label>ลิงก์ (วางลิงก์ Power BI หรือเว็บ)<input type="text" id="fUrl" placeholder="https://…"></label>
  <label>คำอธิบายสั้นๆ<textarea id="fDesc" rows="2" placeholder="รายงานนี้เกี่ยวกับอะไร"></textarea></label>
  <label>หมวด (พิมพ์ใหม่หรือเลือกของเดิม)<input type="text" id="fTag" list="tagList" placeholder="เช่น แบตเตอรี่"></label>
  <datalist id="tagList"></datalist>
  <label>รูปตัวอย่าง (ไม่บังคับ — แคปหน้าจอรายงานแล้วเลือกไฟล์)<input type="file" id="fImg" accept="image/*"></label>
  <div class="prev" id="prev"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn" id="dDelImg">ลบรูป</button><button class="btn" id="dCancel">ยกเลิก</button><button class="btn primary" id="dSave">บันทึก</button>
  </div>
</dialog>

<script>
const KEY = 'launcher_items_v1';
// รายการเริ่มต้น (ใช้ครั้งแรกเท่านั้น หลังจากนั้นแก้ผ่านปุ่มบนหน้าเว็บ)
const DEFAULT_ITEMS = [
  { title: 'Batt12V Dashboard', desc: 'แรงดันและอุณหภูมิแบต 12V (ข้อมูลจาก Google Sheet)', tag: 'แบตเตอรี่', img: '', url: 'https://batt12v.netlify.app/' },
  { title: 'SWOT Water MWA', desc: 'รายงาน SWOT เรื่องน้ำ', tag: 'น้ำ', img: '', url: 'https://swot-water-mwa.netlify.app/' },
  { title: 'Power BI รายงาน 1', desc: 'ยังไม่ได้ตั้งชื่อ — กดแก้ไขเพื่อใส่ชื่อ', tag: 'Power BI', img: '',
    url: 'https://app.powerbi.com/view?r=eyJrIjoiOGNmNDUyMTctNzYzMC00YTJmLWJiOTMtNWYxNzgzYTUyMmY0IiwidCI6IjhlYzMzMGU1LTFjMDUtNGQ1Yi05Nzg2LWM1Nzk4MjFjNmM3NCIsImMiOjEwfQ%3D%3D' },
  { title: 'Power BI รายงาน 2', desc: 'ยังไม่ได้ตั้งชื่อ — กดแก้ไขเพื่อใส่ชื่อ', tag: 'Power BI', img: '',
    url: 'https://app.powerbi.com/view?r=eyJrIjoiM2IzZGUxNmEtMjZmMS00ZDhjLTlhY2MtNDY4Y2ViZjliOTdmIiwidCI6IjhlYzMzMGU1LTFjMDUtNGQ1Yi05Nzg2LWM1Nzk4MjFjNmM3NCIsImMiOjEwfQ%3D%3D' }
];
const $ = id => document.getElementById(id);
let items, tag = '', mode = 'card', editing = -1, tmpImg = '';
try { items = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!Array.isArray(items) || !items.length) items = DEFAULT_ITEMS.map(x => ({...x}));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) { alert('บันทึกไม่ได้ (พื้นที่เก็บของเบราว์เซอร์เต็ม?) ลองใช้รูปที่เล็กลง'); } };
const colors = ['#2b6cdf','#e0662b','#2e9e6a','#8b5cf6','#d6336c','#0ea5b7','#b7791f'];
const hue = s => colors[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % colors.length];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  const q = $('q').value.trim().toLowerCase();
  const list = items.map((i,idx)=>({i,idx})).filter(({i}) => (!tag || i.tag === tag) && (!q || (i.title+' '+i.desc+' '+i.tag).toLowerCase().includes(q)));
  $('grid').hidden = mode !== 'card'; $('egrid').hidden = mode !== 'embed';
  $('grid').innerHTML = list.map(({i,idx}) => {
    const thumb = i.img ? `<div class="thumb" style="background-image:url('${esc(i.img)}')"></div>`
                        : `<div class="thumb" style="background:${hue(i.title)}">${esc([...i.title][0]||'?')}</div>`;
    return `<div class="card">${thumb}<div class="body"><span class="tag">${esc(i.tag)}</span><h2>${esc(i.title)}</h2><p>${esc(i.desc)}</p>
      <div class="row"><a href="${esc(i.url)}" target="_blank" rel="noopener">เปิด</a>
      <button class="sm" data-copy="${idx}" title="คัดลอกลิงก์">คัดลอก</button>
      <button class="sm" data-edit="${idx}" title="แก้ไข">✎</button>
      <button class="sm" data-del="${idx}" title="ลบ">🗑</button></div></div></div>`;
  }).join('');
  if (mode === 'embed') {
    $('egrid').innerHTML = list.map(({i}) => `<div class="ecard"><div class="pill">${esc(i.title)}</div>
      <iframe src="${esc(i.url)}" loading="lazy" allowfullscreen title="${esc(i.title)}"></iframe>
      <div class="row"><a href="${esc(i.url)}" target="_blank" rel="noopener">เปิดเต็มจอ</a></div></div>`).join('');
  }
  $('empty').hidden = list.length > 0;
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const u = items[b.dataset.copy].url;
    try { await navigator.clipboard.writeText(u); b.textContent = '✓'; setTimeout(()=>b.textContent='คัดลอก',1200); } catch(e) { prompt('คัดลอกลิงก์นี้', u); }
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openDlg(+b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const i = items[b.dataset.del]; if (confirm(`ลบ “${i.title}” ออกจากรายการ?`)) { items.splice(+b.dataset.del,1); save(); renderTags(); render(); }
  });
}
function renderTags(){
  const tags = [...new Set(items.map(i => i.tag))];
  if (tag && !tags.includes(tag)) tag = '';
  $('tags').innerHTML = ['ทั้งหมด', ...tags].map(t => `<button class="${(t==='ทั้งหมด'?'':t)===tag?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  $('tags').querySelectorAll('button').forEach(b => b.onclick = () => { tag = b.dataset.t === 'ทั้งหมด' ? '' : b.dataset.t; renderTags(); render(); });
  $('tagList').innerHTML = tags.map(t => `<option value="${esc(t)}">`).join('');
}
function setPrev(){ $('prev').style.backgroundImage = tmpImg ? `url('${tmpImg}')` : 'none'; }
function openDlg(idx){
  editing = idx; const i = idx >= 0 ? items[idx] : {title:'',url:'',desc:'',tag:'',img:''};
  $('dTitle').textContent = idx >= 0 ? 'แก้ไขรายงาน' : 'เพิ่มรายงาน';
  $('fTitle').value = i.title; $('fUrl').value = i.url; $('fDesc').value = i.desc; $('fTag').value = i.tag; $('fImg').value = '';
  tmpImg = i.img || ''; setPrev(); $('dlg').showModal();
}
$('bAdd').onclick = () => openDlg(-1);
$('dCancel').onclick = () => $('dlg').close();
$('dDelImg').onclick = () => { tmpImg = ''; $('fImg').value = ''; setPrev(); };
$('fImg').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image(), r = new FileReader();
  r.onload = () => { im.onload = () => {
    const w = Math.min(480, im.width), h = Math.round(im.height * w / im.width);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im,0,0,w,h);
    tmpImg = c.toDataURL('image/jpeg', 0.75); setPrev(); }; im.src = r.result; };
  r.readAsDataURL(f);
};
$('dSave').onclick = () => {
  let url = $('fUrl').value.trim(), title = $('fTitle').value.trim();
  if (!title) { alert('ใส่ชื่อรายงานก่อน'); return; }
  if (!url) { alert('ใส่ลิงก์ก่อน'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const it = { title, url, desc: $('fDesc').value.trim(), tag: $('fTag').value.trim() || 'ทั่วไป', img: tmpImg };
  if (editing >= 0) items[editing] = it; else items.push(it);
  save(); $('dlg').close(); renderTags(); render();
};
$('bBackup').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items,null,1)], {type:'application/json'}));
  a.download = 'launcher_backup.json'; a.click();
};
$('bRestore').onclick = () => $('fRestore').click();
$('fRestore').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d) || !d.every(x => x.title && x.url)) throw 0;
    if (confirm(`นำเข้า ${d.length} รายการ? รายการปัจจุบันจะถูกแทนที่`)) { items = d; save(); renderTags(); render(); }
  } catch(err) { alert('ไฟล์สำรองไม่ถูกต้อง'); }
  e.target.value = '';
};
$('q').oninput = render;
$('mCard').onclick = () => { mode='card'; $('mCard').classList.add('on'); $('mEmb').classList.remove('on'); render(); };
$('mEmb').onclick = () => { mode='embed'; $('mEmb').classList.add('on'); $('mCard').classList.remove('on'); render(); };
renderTags(); render();
</script>
</body>
</html>
